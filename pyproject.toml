[project]
name = "merchant-content-workbench"
version = "0.1.0"
description = "本地商品内容制作与审核工作台"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "jinja2>=3.1.6,<4", "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<2.1", "alembic>=1.14,<2", "httpx>=0.28,<1"
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
